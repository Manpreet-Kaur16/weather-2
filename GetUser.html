<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GetUser</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
    <table class="border-collapse border border-gray-400 ...">
        <thead>
            <tr>
                <th class="border border-gray-300 ...">Name</th>
                <th class="border border-gray-300 ...">email</th>
                <th class="border border-gray-300 ...">age</th>
                <th class="border border-gray-300 ...">city</th>
            </tr>
        </thead>
        <tbody id="tbody">
            <img id="loading" style="display: none;"
                src="https://upload.wikimedia.org/wikipedia/commons/c/c7/Loading_2.gif">

        </tbody>
        <h1 class="text-2xl font-bold text-center">Random User</h1>
        <select class="w-50 bg-white p-2 border-1 rounded-lg text-center" id="selectOption">
            <option value="">Select option</option>
            <option value="5">5</option>
            <option value="10">10</option>
            <option value="20">20</option>
        </select>
        <div id="paginationContent"></div>
        <script>
            let tbodyElement = document.getElementById("tbody");
            let loadingElement = document.getElementById("loading");
            let selectElement = document.getElementById("selectOption");
            let paginationContent = document.getElementById("paginationContent");
            async function getUserData(number = 5, page = 1) {
                loadingElement.style.display = "block";
                try {
                    let apiResponse = await fetch(`https://api.freeapi.app/api/v1/public/randomusers?limit=${number}&page=${page}`);
                    console.log(apiResponse);
                    let jsonData = await apiResponse.json();
                    console.log(jsonData);
                    displayPaginationData(jsonData.data);

                    //map function//
                    let users = jsonData.data.data;
                    let html = users.map(user => {

                        let bgColor = "bg-gray-100";
                        let age = user.dob.age;

                        if (age < 35) {
                            bgColor = "bg-green-400";
                        } else if (age < 55) {
                            bgColor = "bg-yellow-400";
                        }
                        else {
                            bgColor = "bg-red-400";
                        }
                        console.log(bgColor, age);
                        return `<tr>
                     <td class="border border-gray-300 px-4 py-2">${user.name.first} ${user.name.last}</td>
                     <td class="border border-gray-300 px-4 py-2">${user.email}</td>
                      <td class="${bgColor} border border-gray-300 px-4 py-2">${user.dob.age} </td>
                      <td class="border border-gray-300 px-4 py-2">${user.location.city}</td>
                     </tr>`

                    }).join("");
                    tbodyElement.innerHTML = html;
                }
                catch (error) {
                    console.log(error)
                }
                finally {
                    console.log("finally");
                    loadingElement.style.display = "none";
                }
            }

            selectElement.addEventListener("click", () => {
                console.log(selectElement);
                getUserData(selectElement.value);
            }
            )

            // paginationData here//

            function displayPaginationData(paginationData) {
                console.log(paginationData);
                paginationContent.innerHTML = `<div class="flex justify-between px-4 py-2" >
        <p class="text-md" id="paging"> Showing page no ${paginationData.page} out of ${paginationData.totalPages} Pages</p>
        <div class="flex justify-end gap-2">
            <button class="${paginationData.previousPage ? "bg-gray-500" : "bg-gray-100"} text-white text-md px-4 py-2" id="previousButton" ${paginationData.previousPage ? "" : "disabled"}>Previous</button>
            <button class=" ${paginationData.nextPage ? "bg-gray-500" : "bg-gray-100"} text-white text-md px-4 py-2" id="nextButton" ${paginationData.nextPage ? "" : "disabled"}>Next</button>
        </div>
    </div>`

                let previousButtonElement = document.getElementById("previousButton");
                let nextButtonElement = document.getElementById("nextButton");
                previousButtonElement.addEventListener("click", () => {
                    console.log("Hello previousButton");
                    if (paginationData.previousPage) {
                        getUserData(selectElement.value, paginationData.page - 1);
                    }

                })
                nextButtonElement.addEventListener("click", () => {
                    console.log("Hello nextButton", paginationData.nextPage);
                    if (paginationData.nextPage) {
                        getUserData(selectElement.value, paginationData.page + 1);
                    }
                })
            }

            getUserData();
        </script>
    </table>
</body>

</html>
